services:
  weights-api:
    build: .
    image: survey-weights-api:1.0.0
    container_name: survey-weights-api
    ports:
      - "8000:8000"
    volumes:
      - weights-data:/data
    environment:
      WEIGHTS_DB: /data/weights.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  weights-data:
